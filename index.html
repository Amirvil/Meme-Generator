<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body class="main-layout" onload="onInitGallery()">

    <div class="main-screen" onclick="toggleMenu()"></div>

    <header class="main-header full main-layout">
        <div class="header-container flex space-between align-center">
            <div class="logo">Meme <span class="logo-span">Generator</span></div>
            <nav class="main-nav">
                <ul class="clean-list flex">
                    <li><a class="flex active" href="#" onclick="showGallery(this)">Gallery</a></li>
                    <li><a class="flex" href="#" onclick="showEditor(this)">Editor</a></li>
                    <li><a class="flex" href="#">Memes</a></li>
                    <li><a class="flex" href="#">About</a></li>
                </ul>
            </nav>
            <button onclick="toggleMenu()" class="btn-toggle-menu">☰</button>
        </div>

    </header>

    <section class="gallery-container gallery-layout">
        <div class="search-bar">
            <!-- <input class="input-search input-txt" type="text">
            <button class="btn-search button-1">Search</button> -->
        </div>
        <div class="gallery">

        </div>
    </section>

    <section class="editor-container editor-layout hidden">
        <div class="canvas-container">
            <canvas width="450" height="450"></canvas>
        </div>

        <div class="inputs-container">

            <input class="input-line input-txt" type="text" oninput="onTxtChange(this.value)" />

            <select class="select-font" onchange="onSetFont(this.value)">
                <option value='inconsolata'>inconsolata</option>
                <option value='montserrat'>montserrat</option>
                <option value='playfair'>playfair</option>
                <option value='roboto'>roboto</option>
                <option value='sono'>sono</option>
                <option value='spectral'>spectral</option>
            </select>

            <div class="btn-line-container">
                <button class="btn-add-line" onclick="onAddLine()"></button>
                <button class="btn-del-line" onclick="onDeleteLine()"></button>
                <button class="btn-switch-line" onclick="onSwitchLine()"></button>
                <input class="input-clr" id="input-clr" type="color" onchange="onColorChange(this.value)">
            </div>

            <div class="btn-font-container">
                <button class="btn-inc-font btn2" onclick="onChangeFontSize('increase')">A+</button>
                <button class="btn-dec-font btn2" onclick="onChangeFontSize('decrease')">A-</button>
                <button class="btn-align-left" onclick="onSetTextAlign('left')"></button>
                <button class="btn-align-center" onclick="onSetTextAlign('center')"></button>
                <button class="btn-align-right" onclick="onSetTextAlign('right')"></button>

            </div>

            <div class="btn-move-container">
                <button class="btn-move-left" onclick="onSetMove('left')"></button>
                <button class="btn-move-up" onclick="onSetMove('up')"></button>
                <button class="btn-move-down" onclick="onSetMove('down')"></button>
                <button class="btn-move-right" onclick="onSetMove('right')"></button>
            </div>

            <div class="actions">
                <a href="#" class="btn-download" onclick="onDownloadImg(this)" download="my-img.jpg">Download</a>
                <button class="btn-share btn2" onclick="onShare(event)">Share</button>
            </div>

        </div>
    </section>

    <footer class="main-footer full flex align-center ">
        <small>@ allrights 2025</small>
    </footer>

    <script src="js/meme.controller.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/gellery.controller.js"></script>
    <script src="js/services/gallery.service.js"></script>
</body>

</html>
