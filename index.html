<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body onload="onInit()">

    <header class="main-header">
        <h1>Meme Generator</h1>
    </header>

    <section class="gallery-container">

    </section>

    <section class="editor-container hidden">
        <input class="input-txt" type="text" onchange="onTxtChange(this.value)" />
        <input class="input-clr" type="color" onchange="onColorChange(this.value)">
        <button class="btn-increase" onclick="onChangeFontSize(this.className)">Increase Font Size</button>
        <button class="btn-decrease" onclick="onChangeFontSize(this.className)">Decrease Font Size</button>
        <canvas width="450" height="450"></canvas>
        <a href="#" class="btn-download" onclick="onDownloadImg(this)" download="my-img.jpg">Download</a>
    </section>

    <script src="js/meme.controller.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/gellery.controller.js"></script>

</body>

</html>
