<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body class="main-layout" onload="onInitGallery()">

    <header class="main-header full main-layout">
        <div class="header-container flex space-between align-center">
            <div class="logo inline">Meme Generator</div>
            <nav class="main-nav inline">
                <ul class="clean-list flex">
                    <li><a href="#" onclick="showGallery()">Gallery</a></li>
                    <li><a href="#" onclick="showEditor()">Editor</a></li>
                    <li><a href="#">Memes</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </div>

    </header>

    <section class="gallery-container">
        <div class="search-bar">
            <input class="input-search" type="text">
            <button class="btn-search">Search</button>
        </div>
        <div class="gallery">

        </div>
    </section>

    <section class="editor-container hidden">
        <input class="input-txt" type="text" oninput="onTxtChange(this.value)" />
        <input class="input-clr" type="color" onchange="onColorChange(this.value)">
        <button class="btn-increase" onclick="onChangeFontSize(this.className)">Increase Font Size</button>
        <button class="btn-decrease" onclick="onChangeFontSize(this.className)">Decrease Font Size</button>
        <button class="btn-add-line" onclick="onAddLine()">Add Line</button>
        <button class="btn-switch-line" onclick="onSwitchLine()">Switch Line</button>
        <a href="#" class="btn-download" onclick="onDownloadImg(this)" download="my-img.jpg">Download</a>
        <canvas width="450" height="450"></canvas>
    </section>

    <script src="js/meme.controller.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/gellery.controller.js"></script>
    <script src="js/services/gallery.service.js"></script>
</body>

</html>
