<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body class="main-layout" onload="onInitGallery()">

    <div class="main-screen" onclick="toggleMenu()"></div>

    <header class="main-header full main-layout">
        <div class="header-container flex space-between align-center">
            <div class="logo inline">Meme Generator</div>
            <nav class="main-nav inline">
                <ul class="clean-list flex">
                    <li><a href="#" onclick="showGallery()"> Gallery</a></li>
                    <li><a href="#" onclick="showEditor()">Editor</a></li>
                    <li><a href="#">Memes</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
            <button onclick="toggleMenu()" class="btn-toggle-menu">☰</button>
        </div>

    </header>

    <section class="gallery-container">
        <div class="search-bar">
            <input class="input-search input-txt" type="text">
            <button class="btn-search button-1">Search</button>
        </div>
        <div class="gallery">

        </div>
    </section>

    <section class="editor-container hidden">
        <div class="canvas-container">
            <canvas width="450" height="450"></canvas>
        </div>

        <div class="inputs-container">

            <div class="txt-inputs">
                <div class="input-txt-container">
                    <input class="input-line-txt input-txt" type="text" oninput="onTxtChange(this.value)" />
                </div>
                <div class="txt-actions-container">
                    <a class="fa addLine" href="#" onclick="onAddLine()"></a>
                    <a class="fa switchLine" href="#" onclick="onSwitchLine()"></a>
                    <a class="fa deleteLine" href="#" onclick="onDeleteLine()"></a>
                    <label for="input-clr" class="clr-label">
                        <i class="fa clrPicker"></i>
                        <input class="input-clr" id="input-clr" type="color" onchange="onColorChange(this.value)">
                    </label>
                </div>
            </div>

            <div class="font-inputs">
                <div class="clr-size-inputs">
                    <a class="fa increaseFont" href="#" onclick="onChangeFontSize('up')"></a>
                    <a class="fa decreaseFont" href="#" onclick="onChangeFontSize('down')"></a>
                </div>
                <div class="pos-inputs">
                    <a class="fa left" href="#" onclick="onSetMove('left')"></a>
                    <a class="fa up" href="#" onclick="onSetMove('up')"></a>
                    <a class="fa down" href="#" onclick="onSetMove('down')"></a>
                    <a class="fa right" href="#" onclick="onSetMove('right')"></a>
                </div>
                <div class="align-inputs">
                    <a class="fa font" href="#" onclick=""></a>
                    <a class="fa alignLeft" href="#" onclick="onSetTextAlign('left')"></a>
                    <a class="fa alignCenter" href="#" onclick="onSetTextAlign('center')"></a>
                    <a class="fa alignRight" href="#" onclick="onSetTextAlign('right')"></a>
                </div>

            </div>
            <div class="actions">
                <a href="#" class="btn-download button-1" onclick="onDownloadImg(this)"
                    download="my-img.jpg">Download</a>
                <button class="btn-share button-1" onclick="">Share</button>
            </div>

        </div>
    </section>

    <script src="js/meme.controller.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/gellery.controller.js"></script>
    <script src="js/services/gallery.service.js"></script>
</body>

</html>
